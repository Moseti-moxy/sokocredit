name: CI

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sokocredit-backend/requirements.txt

      - name: Run tests
        working-directory: sokocredit-backend/flask_app
        # Tests need a Fernet key for the customer-PII encryption columns
        # (see app/security.py) - this is a throwaway key for CI only, never
        # used against a real database. Real environments set their own via
        # a repo/environment secret, not this value.
        env:
          FIELD_ENCRYPTION_KEY: 3ooa3nGBzIuQ75Y9juE9Zk_SwpbicJ0Tf1QUxJtKeFM=
          JWT_SECRET_KEY: ci-test-only-not-a-real-secret-do-not-use-in-prod
        run: |
          export PYTHONPATH=$PWD
          pytest -q
