databases:
  - name: sokocredit-db
    plan: free
    databaseName: sokocredit
    user: sokocredit

services:
  - type: web
    name: sokocredit-backend
    runtime: python
    plan: free
    rootDir: sokocredit-backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd flask_app && flask db upgrade && gunicorn -w 2 -b 0.0.0.0:$PORT run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: sokocredit-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Optional third-party integrations (M-Pesa, Airtel, Stripe, SMS/WhatsApp,
      # CRB, business registry) - leave unset until you have real credentials;
      # the app degrades those features to a clear 503 rather than crashing.
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: AIRTEL_BASE_URL
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: CRB_PROVIDER
        sync: false
      - key: CRB_API_BASE_URL
        sync: false
      - key: CRB_API_KEY
        sync: false
      - key: BRS_API_BASE_URL
        sync: false
      - key: BRS_API_KEY
        sync: false
