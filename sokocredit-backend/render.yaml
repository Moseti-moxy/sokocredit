databases:
  - name: sokocredit-db
    plan: free
    databaseName: sokocredit
    user: sokocredit

services:
  - type: web
    name: sokocredit-frontend
    runtime: static
    plan: free
    rootDir: sokocredit-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    # React Router uses client-side routing - without this, refreshing on
    # any path other than / (e.g. /customers) 404s instead of loading the app.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK_AUTH
        value: "false"
      # Points the built frontend at the deployed backend's API. Render only
      # assigns the backend its *.onrender.com URL once it's first deployed,
      # so this can't be wired automatically - after the backend service
      # exists, set this to https://<its-onrender-url>/api and redeploy.
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: sokocredit-backend
    runtime: python
    plan: free
    rootDir: sokocredit-backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd flask_app && flask db upgrade && gunicorn -w 2 -b 0.0.0.0:$PORT run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: sokocredit-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Comma-separated list of your deployed frontend origin(s). Same
      # chicken-and-egg as VITE_API_BASE_URL above: once the sokocredit-frontend
      # static site is deployed, set this to its https://*.onrender.com URL
      # (no trailing slash, no path) and redeploy this service. Falls back to
      # the local Vite dev server if unset - never leave this on '*' in prod.
      - key: CORS_ORIGINS
        sync: false
      # Encrypts customer PII (phone, national ID, etc.) at rest and drives
      # the blind-index lookups - see app/security.py. Losing/rotating this
      # after real data exists makes that data permanently unreadable, so
      # generate it once and store it somewhere durable outside Render too.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Optional third-party integrations (M-Pesa, Airtel, Stripe, SMS/WhatsApp,
      # CRB, business registry) - leave unset until you have real credentials;
      # the app degrades those features to a clear 503 rather than crashing.
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: AIRTEL_BASE_URL
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: CRB_PROVIDER
        sync: false
      - key: CRB_API_BASE_URL
        sync: false
      - key: CRB_API_KEY
        sync: false
      - key: BRS_API_BASE_URL
        sync: false
      - key: BRS_API_KEY
        sync: false
