<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SokoCredit logo">
  <title>SokoCredit</title>
  <defs>
    <linearGradient id="sc-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67a852"/>
      <stop offset="0.5" stop-color="#3f7d2e"/>
      <stop offset="1" stop-color="#2f6322"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge in the app's brand green gradient -->
  <rect width="64" height="64" rx="15" fill="url(#sc-badge)"/>

  <!-- Market stall awning: scalloped canopy ("soko") -->
  <path fill="#ffffff" d="M13.5 13h37q2.5 0 2.5 2.5V21a5.25 5.25 0 0 1-10.5 0 5.25 5.25 0 0 1-10.5 0 5.25 5.25 0 0 1-10.5 0 5.25 5.25 0 0 1-10.5 0v-5.5Q11 13 13.5 13Z"/>

  <!-- Coin ("credit") -->
  <circle cx="21" cy="43.5" r="6" fill="#ffffff"/>
  <circle cx="21" cy="43.5" r="3" fill="none" stroke="#3f7d2e" stroke-width="1.8"/>

  <!-- Rising trend arrow (growth) -->
  <path fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" d="M31 44.5 37 38.2l5 3.9 6-6.3"/>
  <path fill="#ffffff" d="M51.3 32.3 48.89 41.08 42.65 35.14Z"/>
</svg>